name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run gitleaks
        run: bunx gitleaks detect --source . --verbose --config .gitleaks.toml

      - name: Run cspell
        run: bunx cspell lint --no-progress "**/*"

      - name: Run Biome
        run: bun run check

      - name: Type check
        run: bunx tsc --noEmit --skipLibCheck

      - name: Build
        run: bun run build
