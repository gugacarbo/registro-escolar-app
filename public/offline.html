<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Sem conexão · Registro Escolar</title>
		<style>
			:root { color-scheme: light dark; }
			* { box-sizing: border-box; }
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 24px;
				background: #f8fafc;
				color: #0f172a;
				font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				text-align: center;
			}
			main { max-width: 420px; }
			.icon {
				width: 56px;
				height: 56px;
				margin: 0 auto 20px;
				border-radius: 16px;
				display: grid;
				place-items: center;
				background: #dcfce7;
				color: #15803d;
			}
			.icon svg { width: 30px; height: 30px; }
			h1 { margin: 0 0 10px; font-size: 24px; line-height: 1.25; }
			p { margin: 0 0 28px; color: #475569; }
			button {
				border: 0;
				border-radius: 10px;
				padding: 11px 22px;
				background: #15803d;
				color: #fff;
				font: inherit;
				font-weight: 600;
				cursor: pointer;
			}
			button:focus-visible { outline: 3px solid #86efac; outline-offset: 2px; }
			@media (prefers-color-scheme: dark) {
				body { background: #020617; color: #f8fafc; }
				p { color: #94a3b8; }
				.icon { background: #14532d; color: #bbf7d0; }
				button { background: #16a34a; }
				button:focus-visible { outline-color: #365314; }
			}
		</style>
	</head>
	<body>
		<main>
			<div class="icon" aria-hidden="true">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
					<path d="M2 2v20h20" />
					<path d="m5 15 4-6 4 3 5-8" />
				</svg>
			</div>
			<h1>Você está offline</h1>
			<p>A conexão com a internet foi interrompida. Nenhum dado foi alterado.</p>
			<button type="button" onclick="location.reload()">Tentar novamente</button>
		</main>
	</body>
</html>
